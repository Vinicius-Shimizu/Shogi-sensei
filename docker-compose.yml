services:
  backend:
    image: shogi-sensei-backend

    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: shogi-sensei-backend

    env_file:
      - .env



    volumes:
      - ./backend/src:/app/src
      - ./backend/model:/app/model

    environment:
      PYTHONUNBUFFERED: 1

    # restart: unless-stopped
    ports:
     - "8000:8000"

    depends_on:
      database:
        condition: service_healthy

  engine:
    image: shogi-sensei-engine
    container_name: shogi-sensei-engine
    
    stdin_open: true
    tty: true

    shm_size: "2gb"

    build: 
      context: ./engine
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

  database:
    image: postgres:16

    container_name: postgres

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      
    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend

    container_name: shogi-sensei-frontend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  postgres_data: