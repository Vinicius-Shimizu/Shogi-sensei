services:
  app:
    image: shogi-sensei

    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: shogi-sensei

    env_file:
      - .env

    stdin_open: true
    tty: true

    shm_size: "2gb"

    volumes:
      - .:/app
      - ./model:/app/model

    environment:
      PYTHONUNBUFFERED: 1

    # restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16

    container_name: postgres

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      
    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: